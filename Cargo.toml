[workspace]
resolver = "2"
members = [
    "crates/livingsim-core",
    "crates/livingsim-content",
    "crates/livingsim-runner",
    "crates/livingsim-wasm",
    "crates/livingsim-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/CarlesClimentOltra/LivingSimulator"
rust-version = "1.97"

[workspace.dependencies]
livingsim-core = { path = "crates/livingsim-core" }
livingsim-content = { path = "crates/livingsim-content" }
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3.3"
ruzstd = "0.9"
blake3 = { version = "1.8", default-features = false }
rand_chacha = { version = "0.3.1", default-features = false }
rand_core = { version = "0.6.4", default-features = false }
ron = "0.12"
serde_json = "1.0"
rayon = "1.12"
clap = { version = "4.6", features = ["derive"] }
ureq = "3"
wasm-bindgen = "=0.2.130"
js-sys = "0.3"
console_error_panic_hook = "0.1.7"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
debug = false


[profile.release.package.livingsim-wasm]
opt-level = 3
