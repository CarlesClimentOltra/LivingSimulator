name: Bug report
description: Something looks wrong in the simulation, the website or the tooling.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you see, and what did you expect to see instead?
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Where and when
      description: Simulated date/time shown in the clock, the region, and (if relevant) the name of the inhabitant.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Simulation (behaviour, economy, determinism…)
        - Rendering / website
        - Runner / GitHub Actions pipeline
        - Content (/data)
        - Documentation
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Browser and device for website bugs; OS and `rustc --version` for local builds.
  - type: checkboxes
    id: determinism
    attributes:
      label: Determinism
      options:
        - label: This may be a determinism bug (two visitors or native vs. WASM see different states).
