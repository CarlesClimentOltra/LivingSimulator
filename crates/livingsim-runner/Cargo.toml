[package]
name = "livingsim-runner"
description = "Native runner: advances the shared world and writes the files published on GitHub Pages"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "livingsim-runner"
path = "src/main.rs"

[dependencies]
livingsim-core = { workspace = true, features = ["parallel"] }
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
ureq.workspace = true
rayon.workspace = true
