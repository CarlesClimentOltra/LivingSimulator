# livingsim-core must stay deterministic; these types are banned there (see CONTRIBUTING.md).
disallowed-types = [
    { path = "std::collections::HashMap", reason = "iteration order is random; use BTreeMap/IndexMap/Vec" },
    { path = "std::collections::HashSet", reason = "iteration order is random; use BTreeSet/Vec" },
    { path = "std::time::Instant", reason = "no wall clock in the simulation" },
    { path = "std::time::SystemTime", reason = "no wall clock in the simulation" },
]
